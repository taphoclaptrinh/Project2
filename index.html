<!DOCTYPE html>
<html>
<head>
    <title>Bản đồ Tương tác</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    
    <script>
        // --- PHẦN CODE ĐƯỢC THAY ĐỔI ---

        // 1. Định nghĩa 2 góc của khung giới hạn cho Việt Nam
        const corner1 = L.latLng(23.5, 102.0); // Tọa độ góc Tây Bắc
        const corner2 = L.latLng(8.4, 109.5);  // Tọa độ góc Đông Nam
        const maxBounds = L.latLngBounds(corner1, corner2);

        // 2. Thêm các tùy chọn giới hạn vào khi khởi tạo bản đồ
        const map = L.map('map', {
            maxBounds: maxBounds, // Đặt khung giới hạn
            minZoom: 6            // Ngăn người dùng thu nhỏ quá mức
        }).setView([16.0, 108.0], 6); // Đặt khung nhìn ban đầu bao quát cả nước

        // --- KẾT THÚC PHẦN THAY ĐỔI ---

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let startMarker = null;
        let endMarker = null;
        let pathLayer = null;

        // ... (toàn bộ code giao tiếp QWebChannel còn lại giữ nguyên không đổi) ...
        window.onload = function() {
            if (typeof qt !== 'undefined') {
                new QWebChannel(qt.webChannelTransport, function (channel) {
                    window.cpp_bridge = channel.objects.cpp_bridge;
                    
                    cpp_bridge.pointSelected.connect(function(lat, lon, isStartPoint) {
                        if (isStartPoint) {
                            if (startMarker) map.removeLayer(startMarker);
                            if (endMarker) map.removeLayer(endMarker);
                            if (pathLayer) map.removeLayer(pathLayer);
                            startMarker = L.marker([lat, lon], { title: "Điểm bắt đầu" }).addTo(map);
                        } else {
                            if (endMarker) map.removeLayer(endMarker);
                            endMarker = L.marker([lat, lon], { title: "Điểm kết thúc" }).addTo(map);
                        }
                    });

                    cpp_bridge.sendPathData.connect(function(jsonPathData) {
                        const latlngs = JSON.parse(jsonPathData);
                        if (pathLayer) map.removeLayer(pathLayer);
                        pathLayer = L.polyline(latlngs, { color: 'blue', weight: 5, opacity: 0.8 }).addTo(map);
                        if (latlngs.length > 0) {
                            map.fitBounds(pathLayer.getBounds());
                        }
                    });
                });
            }
        };

        map.on('click', function(e) {
            if (window.cpp_bridge) {
                window.cpp_bridge.onMapClicked(e.latlng.lat, e.latlng.lng);
            }
        });
    </script>
</body>
</html>
