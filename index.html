<!DOCTYPE html>
<html>
<head>
    <title>Bản đồ Tương tác</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    
    <script>
        const map = L.map('map').setView([10.77, 106.70], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let startMarker = null;
        let endMarker = null;
        let pathLayer = null;

        // Chờ trang web tải xong rồi mới thiết lập kênh giao tiếp
        window.onload = function() {
            if (typeof qt !== 'undefined') {
                new QWebChannel(qt.webChannelTransport, function (channel) {
                    // cpp_bridge là tên đối tượng ta đã đăng ký ở C++
                    window.cpp_bridge = channel.objects.cpp_bridge;

                    // Lắng nghe tín hiệu 'pointSelected' từ C++ để vẽ marker
                    cpp_bridge.pointSelected.connect(function(lat, lon, isStartPoint) {
                        if (isStartPoint) {
                            if (startMarker) map.removeLayer(startMarker);
                            if (endMarker) map.removeLayer(endMarker);
                            if (pathLayer) map.removeLayer(pathLayer);
                            startMarker = L.marker([lat, lon], { title: "Điểm bắt đầu" }).addTo(map);
                        } else {
                            if (endMarker) map.removeLayer(endMarker);
                            endMarker = L.marker([lat, lon], { title: "Điểm kết thúc" }).addTo(map);
                        }
                    });

                    // Lắng nghe tín hiệu 'sendPathData' từ C++ để vẽ đường đi
                    cpp_bridge.sendPathData.connect(function(jsonPathData) {
                        const latlngs = JSON.parse(jsonPathData);
                        if (pathLayer) map.removeLayer(pathLayer);
                        pathLayer = L.polyline(latlngs, { color: 'blue', weight: 5, opacity: 0.8 }).addTo(map);
                        if (latlngs.length > 0) {
                            map.fitBounds(pathLayer.getBounds());
                        }
                    });
                });
            } else {
                console.log("Khong chay trong moi truong Qt.");
            }
        };

        // Khi người dùng click vào bản đồ, gọi hàm của C++
        map.on('click', function(e) {
            if (window.cpp_bridge) {
                // Gọi hàm onMapClicked() của C++ và truyền tọa độ
                window.cpp_bridge.onMapClicked(e.latlng.lat, e.latlng.lng);
            } else {
                // Hành vi mặc định khi không chạy trong Qt
                L.popup()
                    .setLatLng(e.latlng)
                    .setContent("Bạn vừa click vào: " + e.latlng.toString())
                    .openOn(map);
            }
        });
    </script>
</body>
</html>
